t:750;font-size:13px}.light .button{color:#fff}.button.secondary{background:var(--panel);color:var(--ink);border-color:var(--border)}.button.ghost{background:none;color:var(--muted);border-color:var(--border)}.button.danger{background:transparent;border-color:var(--danger);color:var(--danger)}.button.sm{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-width:0}.panel h2,.panel h3{margin:0 0 15px;font-size:15px;letter-spacing:-.015em}.panel h2{font-size:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel-head h2,.panel-head h3{margin:0}.metric{font-size:clamp(24px,3vw,38px);font-weight:850;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.subtle{font-size:12px;color:var(--muted);margin-top:7px}.kpi-label{font-size:12px;color:var(--muted);margin-bottom:10px}.pill{display:inline-flex;border-radius:100px;border:1px solid var(--border);padding:5px 9px;font-size:11px;color:var(--muted);gap:5px;align-items:center}.sportdot{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--sport,#adb9ad)}.session{padding:13px 14px;border:1px solid var(--border);border-left:3px solid var(--sport,#adb9ad);border-radius:10px;background:var(--panel2);margin-bottom:9px}.session-top{display:flex;gap:9px;justify-content:space-between;align-items:center}.session-title{font-size:13px;font-weight:760}.session-details{color:var(--muted);font-size:11px;margin-top:5px}.session button{margin-top:9px}.empty{border:1px dashed var(--border);border-radius:12px;padding:26px 15px;color:var(--muted);font-size:13px;text-align:center}.progress{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:12px 0}.progress>i{display:block;height:100%;background:var(--success);border-radius:6px}.divider{border-top:1px solid var(--border);margin:17px 0}.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.record{padding:10px 0;border-bottom:1px solid var(--border)}.record:last-child{border:0}.record strong{font-size:20px;letter-spacing:-.04em}.section-title{font-weight:750;margin:20px 0 11px;font-size:14px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px;font-weight:650}.field input,.field select,.field textarea{background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:11px;min-height:42px;width:100%;outline-offset:2px}.field textarea{min-height:80px;resize:vertical}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:17px}.selectbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.selectbar select,.selectbar input{background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:9px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;color:var(--muted);font-size:10px;text-transform:uppercase;padding:8px 0}.day{min-height:113px;padding:9px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0}.day.today{border-color:var(--success)}.day.other{opacity:.46}.daynum{font-size:12px;font-weight:750;margin-bottom:8px}.dayitem{display:block;width:100%;border:0;text-align:left;background:var(--panel2);border-left:3px solid var(--sport);border-radius:4px;padding:6px;font-size:10px;color:var(--ink);margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list-days{display:grid;gap:10px}.list-day{border-bottom:1px solid var(--border);padding:10px 0}.bar-chart{height:125px;display:flex;align-items:flex-end;gap:8px;margin:15px 0 4px}.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}.bar{width:100%;max-width:35px;background:var(--success);min-height:2px;border-radius:5px 5px 2px 2px;opacity:.85}.bar-label{font-size:10px;color:var(--muted)}.note{padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);font-size:12px;color:var(--muted)}.option-list{display:grid;gap:10px}.checkrow{display:flex;gap:8px;align-items:center;font-size:13px}.checkrow input{accent-color:var(--success)}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{background:var(--panel);border:1px solid var(--border);padding:8px 12px;border-radius:8px;color:var(--muted);font-size:12px}.tab.on{background:var(--accent);color:var(--bg)}.light .tab.on{color:#fff}.modal-bg{position:fixed;inset:0;z-index:30;background:#000b;display:flex;justify-content:center;align-items:center;padding:14px}.modal{background:var(--panel);border:1px solid var(--border);width:min(650px,100%);max-height:94vh;overflow:auto;border-radius:17px;padding:22px}.modal h2{margin:0;font-size:21px}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.toast{position:fixed;z-index:50;right:20px;bottom:24px;background:var(--accent);color:var(--bg);padding:13px 18px;border-radius:10px;font-size:13px;font-weight:750;box-shadow:0 9px 30px #0006}.light .toast{color:#fff}.bottom{display:none}.hide{display:none!important}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}td,th{padding:11px 7px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:650}.scroll-x{overflow-x:auto}.move-controls{display:flex;gap:4px}.move-controls button{font-size:10px;padding:3px 7px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:5px}.wide{grid-column:1/-1}.swatch{display:inline-block;height:9px;width:9px;border-radius:50%;background:var(--sport);margin-right:7px}@media(max-width:1050px){.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:780px){.side{display:none}.main{margin:0;width:100%;padding:20px 14px 105px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:12;display:flex;overflow-x:auto;background:var(--panel);border-top:1px solid var(--border);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.bottom .nav{flex:1;min-width:57px;display:flex;flex-direction:column;gap:2px;padding:6px 4px;font-size:9px;text-align:center;white-space:nowrap}.bottom .nav span:first-child{font-size:17px}.grid.three{grid-template-columns:1fr}.panel{padding:16px}.day{min-height:83px;padding:4px}.dayitem{padding:4px 2px;font-size:8px}.daynum{font-size:10px}.calendar{gap:3px}.top{margin-bottom:20px}.topactions .button.secondary{display:none}}@media(max-width:440px){.grid.two,.grid.four{grid-template-columns:1fr 1fr}.grid.two>.panel:has(.session),.grid.two>.panel:has(.record),.grid.two>.panel:has(.fields){grid-column:1/-1}.fields{grid-template-columns:1fr}.metric{font-size:29px}}@media print{.side,.bottom,.topactions,.toolbar,.button,.move-controls{display:none!important}.main{margin:0;width:100%;padding:0}.panel{break-inside:avoid}body{background:white;color:black}.print-only{display:block!important}}.print-only{display:none}
</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast-root"></div><script>
'use strict';
const SPORTS={run:['Course','#9fb6ff'],strength:['Musculation','#deb88b'],climb:['Escalade','#ae9fe0'],muay:['Muay Thaï','#dc9999'],mma:['MMA','#c79bc1'],walk:['Marche','#9ecdb7'],other:['Autre','#a9b2ba']};
const STATUS={planned:'Prévue',done:'Terminée',missed:'Non réalisée',cancelled:'Annulée',archived:'Archivée'};
const SECTIONS=[['dashboard','◈','Dashboard'],['calendar','▦','Calendrier'],['sessions','◉','Séances'],['stats','▥','Statistiques'],['goals','◎','Objectifs'],['recovery','✚','Récupération'],['records','◆','Records'],['settings','⚙','Paramètres']];
const DAYNAMES=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const a=new Date(d);return [a.getFullYear(),String(a.getMonth()+1).padStart(2,'0'),String(a.getDate()).padStart(2,'0')].join('-')};
const parseDay=s=>new Date(s+'T12:00:00');const addDays=(s,n)=>{let d=parseDay(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=parseDay(s);return addDays(s,-((d.getDay()+6)%7))};const today=()=>iso(new Date());const fmt=s=>s?parseDay(s).toLocaleDateString('fr-FR'):'—';
const weekNumber=s=>{let d=parseDay(s);d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));let year=new Date(d.getFullYear(),0,1);return Math.ceil((((d-year)/86400000)+1)/7)};
const uid=()=>globalThis.crypto?.randomUUID?.()||('a'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const defaultState=()=>({schema:1,created:today(),profile:{height:187,weight:83,luc:'6 min 45',tenkm:'54 min 43',pull:15,dips:20,squat:140,ohp:''},sessions:[],records:[],goals:[{id:uid(),sport:'run',title:'Luc Léger : palier 11 (minimum 10)',kind:'free',progress:0,status:'active',comment:''},{id:uid(),sport:'run',title:'10 km en moins de 45 minutes',kind:'free',progress:0,status:'active',comment:''},{id:uid(),sport:'run',title:'Sortie longue de 120 minutes',kind:'free',progress:0,status:'active',comment:''},{id:uid(),sport:'strength',title:'Améliorer ma force et mes records',kind:'free',progress:0,status:'active',comment:''},{id:uid(),sport:'other',title:'5 séances par semaine',kind:'numeric',target:5,progress:0,status:'active',comment:''},{id:uid(),sport:'other',title:'90 % de régularité',kind:'numeric',target:90,progress:0,status:'active',comment:''}],rules:[{id:uid(),day:0,sport:'run',title:'Course',time:''},{id:uid(),day:0,sport:'strength',title:'Musculation',time:''},{id:uid(),day:1,sport:'climb',title:'Escalade (ou course)',time:''},{id:uid(),day:2,sport:'strength',title:'Musculation (ou escalade)',time:''},{id:uid(),day:3,sport:'run',title:'Course',time:''},{id:uid(),day:3,sport:'strength',title:'Musculation',time:''},{id:uid(),day:4,sport:'run',title:'Course (facultative)',time:''},{id:uid(),day:4,sport:'muay',title:'Muay Thaï',time:''},{id:uid(),day:5,sport:'mma',title:'MMA',time:''}],rulesStart:today(),templates:[],exercises:['Tractions','Squat','Développé militaire (OHP)','Dips'],recovery:[],settings:{theme:'dark',units:'metric',onboarded:false,dashboard:['today','week','goals','records','regularity','recovery'],hidden:[]},snapshots:[]});
let state=defaultState(),view='dashboard',calendarDate=today(),calendarMode='month',sessionFilter='all',statsSport='all',statsFrom='',statsTo='',restorePayload=null;
const IDB_NAME='athlete-local-v1';let db=null;
function dbOpen(){return new Promise((resolve,reject)=>{let r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function kvGet(key){return new Promise((res,rej)=>{let q=db.transaction('kv').objectStore('kv').get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function kvSet(key,value){return new Promise((res,rej)=>{let t=db.transaction('kv','readwrite');t.objectStore('kv').put(value,key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
let saveQueue=Promise.resolve();function save(){saveQueue=saveQueue.then(async()=>{await kvSet('state',state);await dailySnapshot()}).catch(e=>{console.error(e);toast('Erreur de stockage local')});return saveQueue}
async function dailySnapshot(){let key='snapshot-'+today();if(await kvGet(key))return;await kvSet(key,{savedAt:new Date().toISOString(),data:exportState()});let keys=await new Promise((res,rej)=>{let q=db.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});let old=keys.filter(k=>String(k).startsWith('snapshot-')).sort().slice(0,-30);if(old.length){let t=db.transaction('kv','readwrite');for(let k of old)t.objectStore('kv').delete(k)}}
function exportState(){let d=structuredClone(state);delete d.snapshots;return {format:'ATHLETE_BACKUP',version:1,exportedAt:new Date().toISOString(),data:d}}
function download(name,blob){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function jsonBackup(){download('ATHLETE-sauvegarde-'+today()+'.json',new Blob([JSON.stringify(exportState(),null,2)],{type:'application/json'}));toast('Sauvegarde téléchargée')}
function toast(s){$('toast-root').innerHTML='<div class="toast">'+esc(s)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast-root').innerHTML='',3300)}
function sportLabel(x){return SPORTS[x]?.[0]||'Autre'}function sportColor(x){return SPORTS[x]?.[1]||'#9da9ad'}
function sportOptions(selected){return Object.entries(SPORTS).map(([k,v])=>`<option value="${k}" ${selected===k?'selected':''}>${esc(v[0])}</option>`).join('')}
function statusOptions(selected){return Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${selected===k?'selected':''}>${v}</option>`).join('')}
function field(label,name,value='',type='text',attrs=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`}
function selectField(label,name,options){return `<div class="field"><label for="f-${name}">${label}</label><select name="${name}" id="f-${name}">${options}</select></div>`}
function textField(label,name,value=''){return `<div class="field full"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`}
function button(s,fn,cls='secondary'){return `<button class="button ${cls} sm" data-action="${fn}">${s}</button>`}
function sessionsFor(from,to){let map=new Map();for(let s of state.sessions){if(s.date>=from&&s.date<=to)map.set(s.id,s)}if(state.rulesStart<=to){for(let date=from;date<=to;date=addDays(date,1)){if(date<state.rulesStart)continue;let day=(parseDay(date).getDay()+6)%7;for(let r of state.rules.filter(r=>r.day===day)){let id='rec-'+r.id+'-'+date;if(!map.has(id))map.set(id,{id,date,sport:r.sport,title:r.title,time:r.time,status:'planned',virtual:true})}}}return [...map.values()].filter(s=>s.status!=='archived').sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''))}
function inWeek(s){let start=monday(s);return sessionsFor(start,addDays(start,6))}
function completion(s){let list=s.filter(v=>v.status!=='cancelled'&&v.status!=='archived');return {done:list.filter(v=>v.status==='done').length,planned:list.length,missed:list.filter(v=>v.status==='missed').length}}
function percent(a,b){return b?Math.round(100*a/b):0}
function canEdit(s){return s.virtual||parseDay(s.date).getTime()>=parseDay(addDays(today(),-7)).getTime()}
function persistSession(s){let idx=state.sessions.findIndex(x=>x.id===s.id);if(idx<0)state.sessions.push(s);else state.sessions[idx]=s}
function sessionCard(s){return `<div class="session" style="--sport:${sportColor(s.sport)}"><div class="session-top"><span class="session-title">${esc(s.title||sportLabel(s.sport))}</span><span class="pill">${STATUS[s.status]||'Prévue'}</span></div><div class="session-details">${fmt(s.date)} · ${sportLabel(s.sport)}${s.time?' · '+esc(s.time):''}${s.duration?' · '+s.duration+' min':''}</div><button class="button ghost sm" data-action="edit-session" data-id="${esc(s.id)}">Ouvrir la fiche</button></div>`}
function getSession(id){let s=state.sessions.find(s=>s.id===id);if(s)return s;let m=/^rec-(.+)-(\d{4}-\d{2}-\d{2})$/.exec(id);if(m){let r=state.rules.find(x=>x.id===m[1]);if(r)return {id,date:m[2],sport:r.sport,title:r.title,time:r.time,status:'planned',virtual:true}}return null}
function header(title,subtitle){return `<header class="top"><div><div class="eyebrow">${esc(subtitle||'ATHLETE / CENTRE DE CONTRÔLE')}</div><h1>${title}</h1></div><div class="topactions"><button class="button secondary" data-action="backup">Exporter</button><button class="button" data-action="new-session">+ Séance</button></div></header>`}
function shell(html){$('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="shield">${shield()}</span>ATHLETE</div><nav>${SECTIONS.map(([id,ic,label])=>`<button data-view="${id}" class="nav ${view===id?'active':''}"><span>${ic}</span>${label}</button>`).join('')}</nav><div class="sidefooter">LOCAL FIRST · AUCUN COMPTE<br>VERSION 0.1 · DONNÉES PRIVÉES</div></aside><main class="main">${html}</main><nav class="bottom">${SECTIONS.map(([id,ic,label])=>`<button data-view="${id}" class="nav ${view===id?'active':''}"><span>${ic}</span>${label==='Statistiques'?'Stats':label==='Récupération'?'Forme':label==='Paramètres'?'Réglages':label}</button>`).join('')}</nav></div>`}
function shield(){return '<svg viewBox="0 0 40 48" fill="none" aria-hidden="true"><path d="M20 2 37 8v17c0 11-9 17-17 21C12 42 3 36 3 25V8L20 2Z" stroke="currentColor" stroke-width="2.2"/><path d="m11 30 9-18 9 18m-14-7h10" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg>'}
function dashboard(){let thisWeek=inWeek(today()),c=completion(thisWeek),todaySessions=sessionsFor(today(),today()),rec=state.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4),latest=state.recovery.filter(r=>r.date<=today()).sort((a,b)=>b.date.localeCompare(a.date))[0];let blocks={today:`<div class="panel"><div class="panel-head"><h2>Aujourd'hui</h2>${button('+ Ajouter','new-session')}</div>${todaySessions.length?todaySessions.map(sessionCard).join(''):'<div class="empty">Aucune séance pour aujourd’hui</div>'}</div>`,week:`<div class="panel"><div class="panel-head"><h2>Cette semaine</h2><span class="pill">S${weekNumber(today())}</span></div><div class="metric">${c.done}<span class="muted"> / ${c.planned}</span></div><div class="subtle">Séances réalisées / prévues</div><div class="progress"><i style="width:${percent(c.done,c.planned)}%"></i></div><div class="rowline small"><span>Objectif hebdomadaire</span><strong>${c.done} / 5</strong></div><div class="rowline small"><span>Non réalisées</span><strong>${c.missed}</strong></div></div>`,goals:`<div class="panel"><div class="panel-head"><h2>Objectifs actifs</h2>${button('Voir','go-goals')}</div>${state.goals.filter(x=>x.status==='active').slice(0,4).map(g=>`<div class="record"><div class="small">${esc(g.title)}</div><div class="progress"><i style="width:${Math.min(100,Math.max(0,+g.progress||0))}%"></i></div><div class="tiny muted">${g.progress||0}% · ${sportLabel(g.sport)}</div></div>`).join('')||'<div class="empty">Aucun objectif</div>'}</div>`,records:`<div class="panel"><div class="panel-head"><h2>Mes records</h2>${button('Voir','go-records')}</div>${rec.length?rec.map(r=>`<div class="rowline record"><div><div class="small">${esc(r.title)}</div><div class="tiny muted">${sportLabel(r.sport)}</div></div><strong>${esc(r.value)} ${esc(r.unit||'')}</strong></div>`).join(''):'<div class="empty">Aucun record saisi. Tu peux ajouter tes records antérieurs.</div>'}</div>`,regularity:`<div class="panel"><h2>Régularité</h2><div class="grid two"><div><div class="metric">${percent(c.done,c.planned)}%</div><div class="small muted">Réalisées / prévues</div></div><div><div class="metric">${percent(c.done,5)}%</div><div class="small muted">Réalisées / objectif (5)</div></div></div></div>`,recovery:`<div class="panel"><div class="panel-head"><h2>État de forme</h2>${button('Renseigner','go-recovery')}</div>${latest?`<div class="metric" style="font-size:25px">${esc(latest.form||'Non évalué')}</div><div class="subtle">Fatigue : ${esc(latest.fatigue||'—')} · ${fmt(latest.date)}</div>`:'<div class="empty">Aucune évaluation enregistrée</div>'}</div>`};let ordered=state.settings.dashboard.filter(x=>blocks[x]&&!state.settings.hidden.includes(x));return header('Tableau de bord','SUIVI / '+fmt(today()))+`<div class="grid four" style="margin-bottom:17px"><div class="panel"><div class="kpi-label">Séances réalisées · 7 j</div><div class="metric">${c.done}</div></div><div class="panel"><div class="kpi-label">Séances planifiées · 7 j</div><div class="metric">${c.planned}</div></div><div class="panel"><div class="kpi-label">Objectifs atteints</div><div class="metric">${state.goals.filter(g=>g.status==='done').length}</div></div><div class="panel"><div class="kpi-label">Records enregistrés</div><div class="metric">${state.records.length}</div></div></div><div class="grid two">${ordered.map((id,i)=>`<div>${blocks[id]}<div class="move-controls" style="justify-content:flex-end;margin:6px 0 12px"><button data-action="move-block" data-id="${id}" data-dir="-1">↑</button><button data-action="move-block" data-id="${id}" data-dir="1">↓</button><button data-action="hide-block" data-id="${id}">Masquer</button></div></div>`).join('')}</div>`}
function calendar(){let anchor=parseDay(calendarDate),start,end;if(calendarMode==='week'){start=monday(calendarDate);end=addDays(start,6)}else{let first=iso(new Date(anchor.getFullYear(),anchor.getMonth(),1)),last=iso(new Date(anchor.getFullYear(),anchor.getMonth()+1,0));start=monday(first);end=addDays(monday(last),6)}let sessions=sessionsFor(start,end),byDate={};for(let s of sessions)(byDate[s.date]??=[]).push(s);let html='';if(calendarMode==='week'||calendarMode==='month'||calendarMode==='grid'){html=`<div class="calendar">${DAYNAMES.map(x=>`<div class="weekday">${x.slice(0,3)}</div>`).join('')}${Array.from({length:Math.round((parseDay(end)-parseDay(start))/86400000)+1},(_,i)=>{let day=addDays(start,i);return `<div class="day ${day===today()?'today':''} ${parseDay(day).getMonth()!==anchor.getMonth()&&calendarMode!=='week'?'other':''}"><div class="daynum">${parseDay(day).getDate()}</div>${(byDate[day]||[]).map(s=>`<button class="dayitem" data-action="edit-session" data-id="${esc(s.id)}" style="--sport:${sportColor(s.sport)}">${esc(s.title||sportLabel(s.sport))}</button>`).join('')}</div>`}).join('')}</div>`}else{html=`<div class="list-days">${Array.from({length:Math.round((parseDay(end)-parseDay(start))/86400000)+1},(_,i)=>{let day=addDays(start,i);return `<div class="list-day"><strong class="small">${fmt(day)}</strong><div style="margin-top:9px">${(byDate[day]||[]).map(sessionCard).join('')||'<div class="small muted">Repos / aucune séance</div>'}</div></div>`}).join('')}</div>`}return header('Calendrier','PLANIFICATION / RÉCURRENCE')+`<div class="toolbar"><div class="actions">${button('←','calendar-prev')}${button('Aujourd’hui','calendar-today')}${button('→','calendar-next')}<strong>${anchor.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</strong></div><div class="tabs">${[['week','Semaine'],['month','Mois'],['grid','Grille'],['list','Liste']].map(([v,l])=>`<button class="tab ${calendarMode===v?'on':''}" data-action="calendar-mode" data-id="${v}">${l}</button>`).join('')}</div></div>${html}<div style="margin-top:18px" class="actions">${button('Modifier le planning hebdomadaire','edit-rules')}${button('Créer une séance','new-session')}</div>`}
function sessionsPage(){let start=addDays(today(),-365),end=addDays(today(),365),list=sessionsFor(start,end).filter(s=>sessionFilter==='all'||s.sport===sessionFilter).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,160);return header('Séances','JOURNAL SPORTIF')+`<div class="toolbar"><div class="selectbar"><select id="session-filter"><option value="all">Tous les sports</option>${Object.entries(SPORTS).map(([k,v])=>`<option value="${k}" ${sessionFilter===k?'selected':''}>${v[0]}</option>`).join('')}</select></div><div class="actions">${button('Modèles','templates')}${button('+ Nouvelle séance','new-session','')}</div></div><div class="grid two"><div class="panel"><h2>Journal et séances planifiées</h2>${list.length?list.map(sessionCard).join(''):'<div class="empty">Aucune séance enregistrée</div>'}</div><div class="panel"><h2>Bibliothèque de tests et exercices</h2><p class="small muted">Course : Luc Léger, 10 km, test personnalisé. Musculation : exercices libres et personnalisés.</p><div class="divider"></div><h3>Exercices</h3>${state.exercises.map(x=>`<div class="record small">${esc(x)}</div>`).join('')}<div style="margin-top:15px">${button('+ Exercice','new-exercise')}</div></div></div>`}
function weeklyCounts(n=8){let start=monday(today());return Array.from({length:n},(_,i)=>{let d=addDays(start,-7*(n-i-1));return {date:d,...completion(sessionsFor(d,addDays(d,6)))}})}
function barChart(data){let mx=Math.max(1,...data.map(d=>d.done));return `<div class="bar-chart">${data.map(d=>`<div class="bar-wrap"><span class="tiny muted">${d.done}</span><div class="bar" style="height:${Math.max(2,90*d.done/mx)}px"></div><span class="bar-label">S${weekNumber(d.date)}</span></div>`).join('')}</div>`}
function stats(){let history=state.sessions.filter(s=>s.status==='done'&&(!statsFrom||s.date>=statsFrom)&&(!statsTo||s.date<=statsTo)&&(statsSport==='all'||s.sport===statsSport));let current=completion(inWeek(today()));let prev=completion(sessionsFor(addDays(monday(today()),-7),addDays(monday(today()),-1)));let d=parseDay(today()),monthStart=iso(new Date(d.getFullYear(),d.getMonth(),1)),prevMonthStart=iso(new Date(d.getFullYear(),d.getMonth()-1,1)),prevMonthEnd=addDays(monthStart,-1);let mo=state.sessions.filter(s=>s.status==='done'&&s.date>=monthStart&&s.date<=today()).length,pm=state.sessions.filter(s=>s.status==='done'&&s.date>=prevMonthStart&&s.date<=prevMonthEnd).length;let outliers=[];for(let s of history.filter(x=>x.sport==='run'&&x.distance&&x.duration)){let speed=60*s.distance/s.duration;if(speed>30||speed<2)outliers.push('Vitesse inhabituelle : '+fmt(s.date)+' ('+speed.toFixed(1)+' km/h)')}let missing=state.sessions.filter(s=>s.status==='done'&&!s.duration).length;return header('Statistiques','ANALYSE / PERFORMANCES')+`<div class="toolbar"><div class="selectbar"><select id="stats-sport"><option value="all">Tous les sports</option>${Object.entries(SPORTS).map(([k,v])=>`<option value="${k}" ${statsSport===k?'selected':''}>${v[0]}</option>`).join('')}</select><input id="stats-from" type="date" value="${statsFrom}"><input id="stats-to" type="date" value="${statsTo}"></div></div><div class="grid four"><div class="panel"><div class="kpi-label">Cette semaine</div><div class="metric">${current.done}</div><div class="subtle">Précédente : ${prev.done}</div></div><div class="panel"><div class="kpi-label">Ce mois</div><div class="metric">${mo}</div><div class="subtle">Mois précédent : ${pm}</div></div><div class="panel"><div class="kpi-label">Régularité / prévues</div><div class="metric">${percent(current.done,current.planned)}%</div></div><div class="panel"><div class="kpi-label">Régularité / 5</div><div class="metric">${percent(current.done,5)}%</div></div></div><div class="grid two" style="margin-top:16px"><div class="panel"><h2>8 dernières semaines</h2>${barChart(weeklyCounts())}<div class="small muted">Nombre de séances terminées</div></div><div class="panel"><h2>Bilan hebdomadaire</h2><div class="rowline"><span>Terminées</span><strong>${current.done}</strong></div><div class="rowline"><span>Prévues (hors annulations)</span><strong>${current.planned}</strong></div><div class="rowline"><span>Non réalisées</span><strong>${current.missed}</strong></div><div class="divider"></div><h3>Contrôle des données</h3><div class="small muted">${missing} séance(s) terminée(s) sans durée.</div>${outliers.slice(0,4).map(x=>`<div class="note" style="margin-top:7px">${esc(x)}</div>`).join('')}</div><div class="panel"><h2>Comparaison des performances de course</h2>${performanceTable('run')}</div><div class="panel"><h2>Charges en musculation</h2>${performanceTable('strength')}</div><div class="panel wide"><h2>Bilan mensuel chiffré</h2><div class="grid three"><div><div class="metric">${mo}</div><span class="small muted">séances terminées</span></div><div><div class="metric">${state.records.length}</div><span class="small muted">records saisis</span></div><div><div class="metric">${state.goals.filter(g=>g.status==='done').length}</div><span class="small muted">objectifs atteints</span></div></div></div></div>`}
function performanceTable(sport){let rows=state.sessions.filter(s=>s.status==='done'&&s.sport===sport).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);return rows.length?`<div class="scroll-x"><table><tr><th>Date</th><th>Activité</th><th>Résultat</th></tr>${rows.map(s=>`<tr><td>${fmt(s.date)}</td><td>${esc(s.title||sportLabel(s.sport))}</td><td>${sport==='run'?`${s.distance||'—'} km · ${s.duration||'—'} min`:(s.lifts||[]).map(x=>esc(x.name)+': '+esc(x.weight)+' kg').join(', ')||'—'}</td></tr>`).join('')}</table></div>`:'<div class="empty">Les résultats apparaîtront après la saisie des premières séances.</div>'}
function goalsPage(){return header('Objectifs','CYCLE / 3 MOIS')+`<div class="toolbar"><span class="small muted">Évaluation hebdomadaire, validation exclusivement manuelle.</span>${button('+ Objectif','new-goal','')}</div><div class="grid two">${state.goals.map(g=>`<div class="panel"><div class="panel-head"><span class="pill"><span class="sportdot" style="--sport:${sportColor(g.sport)}"></span>${sportLabel(g.sport)}</span><span class="pill">${{active:'En cours',done:'Atteint',abandoned:'Abandonné'}[g.status]}</span></div><h2>${esc(g.title)}</h2><div class="progress"><i style="width:${Math.min(100,Math.max(0,g.progress||0))}%"></i></div><div class="rowline"><span class="small muted">Progression déclarée : ${g.progress||0}%</span>${button('Ouvrir','open-goal-'+g.id)}</div><button class="hide" data-goal="${esc(g.id)}"></button>${g.comment?`<p class="small muted">${esc(g.comment)}</p>`:''}</div>`).join('')}</div>`}
function recordsPage(){let sorted=[...state.records].sort((a,b)=>a.title.localeCompare(b.title)||b.date.localeCompare(a.date));let group={};for(let r of sorted)(group[r.title]??=[]).push(r);return header('Records','HISTORIQUE / MEILLEURES PERFORMANCES')+`<div class="toolbar"><span class="small muted">Les records antérieurs peuvent être ajoutés sans créer de séances.</span>${button('+ Ajouter un record','new-record','')}</div><div class="grid two">${Object.entries(group).map(([title,entries])=>`<div class="panel"><h2>${esc(title)}</h2>${entries.map((r,i)=>`<div class="rowline record"><div class="small muted">${fmt(r.date)} · ${sportLabel(r.sport)}${i===0?' · Dernier saisi':''}</div><div><strong>${esc(r.value)} ${esc(r.unit||'')}</strong> ${button('Éditer','record-'+r.id)}</div></div>`).join('')}</div>`).join('')||'<div class="panel wide"><div class="empty">Aucun record. Ajoute tes valeurs de référence dans cette rubrique.</div></div>'}</div>`}
function recoveryPage(){let saved=state.recovery.find(r=>r.date===today())||{date:today(),fatigue:'Moyenne',pain:'',form:'Bon'};let recent=[...state.recovery].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);return header('Récupération','ÉTAT QUOTIDIEN / BILAN HEBDOMADAIRE')+`<div class="grid two"><div class="panel"><h2>Journal du jour</h2><form id="recovery-form" class="fields">${field('Date','date',saved.date,'date')}${selectField('Fatigue','fatigue',['Faible','Moyenne','Élevée'].map(v=>`<option ${saved.fatigue===v?'selected':''}>${v}</option>`).join(''))}${field('Zone douloureuse (facultatif)','pain',saved.pain||'')}${selectField('Forme générale','form',['Excellent','Bon','Moyen','Faible'].map(v=>`<option ${saved.form===v?'selected':''}>${v}</option>`).join(''))}<div class="full"><button class="button" type="submit">Enregistrer l’évaluation</button></div></form><p class="small muted">Une valeur quotidienne de forme est conservée ; tu peux t'en servir pour ton évaluation hebdomadaire.</p></div><div class="panel"><h2>Historique</h2>${recent.length?recent.map(r=>`<div class="rowline record small"><div>${fmt(r.date)}<div class="tiny muted">${esc(r.pain||'Aucune zone déclarée')}</div></div><div>${esc(r.form)} · ${esc(r.fatigue)}</div></div>`).join(''):'<div class="empty">Aucune évaluation enregistrée.</div>'}</div></div>`}
function settingsPage(){return header('Paramètres','PRIVÉ / STOCKAGE LOCAL')+`<div class="grid two"><div class="panel"><h2>Profil sportif</h2><form id="profile-form" class="fields">${field('Taille (cm)','height',state.profile.height,'number','min="30" max="250"')}${field('Poids de référence (kg)','weight',state.profile.weight,'number','min="1" step="0.1"')}${field('Luc Léger','luc',state.profile.luc)}${field('10 km','tenkm',state.profile.tenkm)}${field('Tractions','pull',state.profile.pull,'number')}${field('Dips','dips',state.profile.dips,'number')}${field('Squat 1RM (kg)','squat',state.profile.squat,'number')}${field('OHP (kg)','ohp',state.profile.ohp,'number')}<div class="full"><button class="button" type="submit">Enregistrer le profil</button></div></form><div class="note" style="margin-top:12px">Ces valeurs sont des références de profil ; elles ne créent aucune séance dans l’historique.</div></div><div class="panel"><h2>Préférences</h2><form id="prefs-form" class="fields">${selectField('Thème','theme',`<option value="dark" ${state.settings.theme==='dark'?'selected':''}>Sombre</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Clair</option>`)}${selectField('Unités','units',`<option value="metric" ${state.settings.units==='metric'?'selected':''}>Métriques</option><option value="imperial" ${state.settings.units==='imperial'?'selected':''}>Impériales (affichage)</option>`)}<div class="full"><button class="button" type="submit">Enregistrer les préférences</button></div></form><div class="divider"></div><h3>Blocs du tableau de bord</h3>${['today','week','goals','records','regularity','recovery'].map(id=>`<label class="checkrow"><input type="checkbox" data-block="${id}" ${!state.settings.hidden.includes(id)?'checked':''}> ${({today:'Aujourd’hui',week:'Semaine',goals:'Objectifs',records:'Records',regularity:'Régularité',recovery:'Récupération'})[id]}</label>`).join('')}</div><div class="panel"><h2>Données et sauvegardes</h2><p class="small muted">Aucune donnée sportive n'est envoyée sur un serveur. Les sauvegardes automatiques sont des instantanés locaux conservés jusqu’à 30 jours, quand l’application est ouverte.</p><div class="actions">${button('Sauvegarde complète JSON','backup')}${button('Importer / restaurer','restore')}${button('Exporter Excel (.xlsx)','excel')}${button('Rapport PDF mensuel','pdf')}</div><div class="divider"></div><div class="actions">${button('Voir les sauvegardes locales','local-snapshots')}${button('Revoir le tutoriel','onboarding')}</div><p class="note" style="margin-top:15px">Pour protéger tes données contre la perte du téléphone, exporte régulièrement un fichier JSON vers un support sûr. Le stockage navigateur peut être effacé par le système.</p></div><div class="panel"><h2>Planning et modèles</h2><div class="actions">${button('Planning hebdomadaire','edit-rules')}${button('Modèles de séance','templates')}</div><div class="divider"></div><h3>Notifications</h3><p class="small muted">Vérification des séances non validées lorsque l’application est ouverte. Les rappels garantis en arrière-plan exigeraient un service externe ou des capacités système spécifiques.</p>${button('Autoriser les notifications','notifications')}</div></div>`}
function render(){document.body.classList.toggle('light',state.settings.theme==='light');let fn={dashboard,calendar,sessions:sessionsPage,stats,goals:goalsPage,recovery:recoveryPage,records:recordsPage,settings:settingsPage}[view]||dashboard;shell(fn())}
function go(id){view=id;render();window.scrollTo(0,0)}
function modal(title,body){$('modal-root').innerHTML=`<div class="modal-bg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true"><div class="modal-title"><h2>${title}</h2><button class="button ghost sm" data-action="close-modal">✕</button></div>${body}</div></div>`}
function closeModal(){$('modal-root').innerHTML=''}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function sportFields(sport,s={}){if(sport==='run')return `${field('Durée (minutes)','duration',s.duration||'','number','step="0.01" min="0"')}${field('Distance (km)','distance',s.distance||'','number','step="0.001" min="0"')}${selectField('Type','runType',['Footing','Sortie longue','Fractionné','Test'].map(x=>`<option ${s.runType===x?'selected':''}>${x}</option>`).join(''))}${selectField('Test','testType',['','Luc Léger','10 km','Personnalisé'].map(x=>`<option ${s.testType===x?'selected':''}>${x||'Aucun'}</option>`).join(''))}${field('Résultat du test (si applicable)','testResult',s.testResult||'')}<div class="full note" id="speed-display">Vitesse / allure calculées automatiquement après saisie.</div>`;
if(sport==='strength'){let lifts=s.lifts?.length?s.lifts:[{name:state.exercises[0],sets:3,reps:8,weight:0}];return `<div class="full"><div class="section-title">Exercices</div><div id="lifts">${lifts.map((l,i)=>liftRow(l,i)).join('')}</div><button class="button ghost sm" type="button" data-action="add-lift">+ Ajouter un exercice</button></div>${field('Durée (minutes)','duration',s.duration||'','number','min="0"')}`}

if(action==='download-snapshot'){kvGet(id).then(d=>{download('ATHLETE-'+id+'.json',new Blob([JSON.stringify(d.data||d,null,2)],{type:'application/json'}))});return}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-view]');if(nav){go(nav.dataset.view);return}let b=e.target.closest('[data-action]');if(b){if(b.type==='submit')return;handleAction(b.dataset.action,b.dataset.id,b);return}if(e.target.id==='modal-bg')closeModal()});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='session-filter'){sessionFilter=t.value;render()}if(t.id==='stats-sport'){statsSport=t.value;render()}if(['stats-from','stats-to'].includes(t.id)){statsFrom=$('stats-from').value;statsTo=$('stats-to').value;render()}if(t.dataset.block){let id=t.dataset.block;state.settings.hidden=state.settings.hidden.filter(x=>x!==id);if(!t.checked)state.settings.hidden.push(id);save()}});
document.addEventListener('submit',e=>{if(e.target.id==='recovery-form'){e.preventDefault();let v=formData(e.target),i=state.recovery.findIndex(x=>x.date===v.date);if(i<0)state.recovery.push(v);else state.recovery[i]=v;save();render();toast('Évaluation enregistrée')}if(e.target.id==='profile-form'){e.preventDefault();state.profile=formData(e.target);save();render();toast('Profil enregistré')}if(e.target.id==='prefs-form'){e.preventDefault();Object.assign(state.settings,formData(e.target));save();render();toast('Préférences enregistrées')}});
(async()=>{try{db=await dbOpen();let saved=await kvGet('state');if(saved){state=saved;state.settings??=defaultState().settings;state.settings.dashboard??=['today','week','goals','records','regularity','recovery'];state.settings.hidden??=[];state.exercises??=[];state.templates??=[];state.recovery??=[]}else await kvSet('state',state);await dailySnapshot();render();if(!state.settings.onboarded)onboard();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(console.warn);if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});checkReminders();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()})}catch(e){console.error(e);$('app').innerHTML='<main style="padding:30px"><h1>ATHLETE</h1><p>Impossible d’ouvrir le stockage local. Vérifie que le navigateur autorise IndexedDB et que l’application est ouverte depuis HTTPS ou localhost.</p><pre>'+esc(e.message)+'</pre></main>'}})();
</script></body></html>
